spring:
  application:
    name: eventcart

  datasource:
    url: jdbc:postgresql://${EVENTCART_DB_HOST:localhost}:${EVENTCART_DB_PORT:5439}/${EVENTCART_DB_NAME:eventcart}
    username: ${EVENTCART_DB_USER:eventcart}
    password: ${EVENTCART_DB_PASSWORD:eventcart}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${EVENTCART_KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

eventcart:
  auth:
    session-ttl: 24h
    bcrypt-strength: 10
  idempotency:
    ttl: 24h
  checkout:
    latency: 50ms
    timeout: 500ms
  rate-limit:
    capacity: 100
    window: 1m
  outbox:
    poll-interval: 1s
    batch-size: 100
  expiry:
    poll-interval: 5s
    batch-size: 100
