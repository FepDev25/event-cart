name: EventCart

services:
  postgres:
    image: postgres:17-alpine
    container_name: eventcart-postgres
    environment:
      POSTGRES_DB: ${EVENTCART_DB_NAME:-eventcart}
      POSTGRES_USER: ${EVENTCART_DB_USER:-eventcart}
      POSTGRES_PASSWORD: ${EVENTCART_DB_PASSWORD:-eventcart}
    ports:
      - "${EVENTCART_DB_PORT:-5439}:5432"
    volumes:
      - eventcart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENTCART_DB_USER:-eventcart} -d ${EVENTCART_DB_NAME:-eventcart}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    container_name: eventcart-kafka
    ports:
      - "${EVENTCART_KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: eventcart-kafka-ui
    depends_on:
      - kafka
    ports:
      - "${EVENTCART_KAFKA_UI_PORT:-8095}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: eventcart
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

volumes:
  eventcart-postgres-data:
