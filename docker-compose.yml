name: EventCart

services:
  postgres:
    image: postgres:17-alpine
    container_name: eventcart-postgres
    environment:
      POSTGRES_DB: ${EVENTCART_DB_NAME:-eventcart}
      POSTGRES_USER: ${EVENTCART_DB_USER:-eventcart}
      POSTGRES_PASSWORD: ${EVENTCART_DB_PASSWORD:-eventcart}
    ports:
      - "${EVENTCART_DB_PORT:-5439}:5432"
    volumes:
      - eventcart-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${EVENTCART_DB_USER:-eventcart} -d ${EVENTCART_DB_NAME:-eventcart}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  eventcart-postgres-data:
